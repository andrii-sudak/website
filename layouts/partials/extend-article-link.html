{{- if eq .Params.source "mastodon" -}}
  <span class="mastodon-source-badge" title="Syndicated from Mastodon">
    {{- partial "icon.html" "mastodon" -}}
    <span>Mastodon</span>
  </span>
{{- else if eq .Params.source "pixelfed" -}}
  <span class="mastodon-source-badge" title="Syndicated from Pixelfed">
    {{- partial "icon.html" "pixelfed" -}}
    <span>Pixelfed</span>
  </span>
{{- else if eq .Params.source "devto" -}}
  <span class="mastodon-source-badge" title="Syndicated from DEV.to">
    {{- partial "icon.html" "dev" -}}
    <span>DEV.to</span>
  </span>
{{- end -}}
