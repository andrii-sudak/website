name: Deploy Hugo to Codeberg Pages
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Setup Hugo
        uses: https://github.com/peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Build with Hugo
        run: |
          hugo mod get -u
          hugo -d public --minify --baseURL https://andrii-sudak.com/

      - name: Deploy to pages branch
        run: |
          git config --global user.name "Codeberg Actions"
          git config --global user.email "actions@codeberg.org"
          cd public
          git init
          git checkout -b pages
          git add .
          git commit -m "Deploy Hugo site from main"
          git push --force "https://${{ forge.repository_owner }}:${{ forge.token }}@codeberg.org/${{ forge.repository }}.git" pages
